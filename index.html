<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profesjonalna aplikacja do śledzenia treningów i postępów." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KubaGym" />

    <title>KubaGym - Aplikacja Treningowa</title>

    <!-- Preload fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" as="style" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" as="style" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/index.css" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
</head>
<body>
    <div class="app-container">
        <div class="app-main">
            <!-- Home Screen -->
            <div id="screen-home" class="screen">
                <div class="container">
                    <div class="home-hero text-center mb-3xl">
                        <h1 class="text-5xl weight-900 mb-lg">🏋️ KubaGym</h1>
                        <p class="text-lg text-dim mb-2xl">Śledzenie treningów, który zwycięża</p>
                        <button class="btn" onclick="navigateTo('plan')">Mój Plan Treningowy</button>
                    </div>

                    <div class="grid grid-2 gap-lg">
                        <div class="card text-center">
                            <div class="text-4xl mb-md">📊</div>
                            <h3 class="text-xl weight-600 mb-sm">Statystyki</h3>
                            <p class="text-sm text-dim">Postępy i trendy</p>
                            <button class="btn btn-secondary w-full mt-lg" onclick="navigateTo('stats')">Szczegóły</button>
                        </div>
                        <div class="card text-center">
                            <div class="text-4xl mb-md">📋</div>
                            <h3 class="text-xl weight-600 mb-sm">Plan</h3>
                            <p class="text-sm text-dim">Tygodniowy plan</p>
                            <button class="btn btn-secondary w-full mt-lg" onclick="navigateTo('plan')">Przeglądaj</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Plan Screen -->
            <div id="screen-plan" class="screen hidden">
                <div class="container">
                    <h1 class="text-3xl weight-700 mb-lg">Plan Treningowy</h1>
                    <div id="plan-content"></div>
                </div>
            </div>

            <!-- Stats Screen -->
            <div id="screen-stats" class="screen hidden">
                <div class="container">
                    <h1 class="text-3xl weight-700 mb-lg">Statystyki</h1>
                    <div id="stats-content"></div>
                </div>
            </div>

            <!-- Workout Screen -->
            <div id="screen-workout" class="screen hidden">
                <div class="container">
                    <div class="flex justify-between align-center mb-lg">
                        <h1 id="workout-title" class="text-3xl weight-700">Trening</h1>
                        <button class="btn btn-ghost" onclick="goBackFromWorkout()">← Wróć</button>
                    </div>
                    <div id="workout-content"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav" class="bottom-nav">
            <div class="flex justify-center gap-lg">
                <button class="nav-btn active" data-view="home" onclick="navigateTo('home')">
                    <span>🏠 Dom</span>
                </button>
                <button class="nav-btn" data-view="plan" onclick="navigateTo('plan')">
                    <span>📋 Plan</span>
                </button>
                <button class="nav-btn" data-view="workout" onclick="navigateToWorkoutFromNav()">
                    <span>💪 Trening</span>
                </button>
                <button class="nav-btn" data-view="stats" onclick="navigateTo('stats')">
                    <span>📊 Statystyki</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Main scripts -->
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/main.js"></script>

    <!-- Service Worker registration -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch((err) => {
                    console.log("ServiceWorker registration failed: ", err);
                });
            });
        }
    </script>
</body>
</html>
