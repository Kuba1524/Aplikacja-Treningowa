<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profesjonalna aplikacja do śledzenia treningów i postępów." />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KubaGym" />

    <title>KubaGym - Aplikacja Treningowa</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="./src/styles/index.css" />

    <link rel="manifest" href="/manifest.json" />
</head>
<body>
    <div class="app-container">
        <div class="app-main">
            <!-- Home Screen -->
            <div id="screen-home" class="screen">
                <div class="container" id="home-content">
                    <!-- treść wstawia JS (renderHome) -->
                </div>
            </div>

            <div id="screen-plan" class="screen hidden">
                <div class="container">
                    <h1 class="text-3xl weight-700 mb-lg">Plan Treningowy</h1>
                    <div id="plan-content"></div>
                </div>
            </div>

            <div id="screen-stats" class="screen hidden">
                <div class="container">
                    <h1 class="text-3xl weight-700 mb-lg">Statystyki</h1>
                    <div id="stats-content"></div>
                </div>
            </div>

            <div id="screen-workout" class="screen hidden">
                <div class="container">
                    <div class="flex justify-between align-center mb-lg">
                        <h1 id="workout-title" class="text-3xl weight-700">Trening</h1>
                        <button class="btn btn-ghost" onclick="goBackFromWorkout()">← Wróć</button>
                    </div>
                    <div id="workout-content"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav" class="bottom-nav">
            <div class="flex justify-center gap-lg">
                <button class="nav-btn active" data-view="home" onclick="navigateTo('home')">
                    <span>🏠 Dom</span>
                </button>
                <button class="nav-btn" data-view="plan" onclick="navigateTo('plan')">
                    <span>📋 Plan</span>
                </button>
                <button class="nav-btn" data-view="workout" onclick="navigateToWorkoutFromNav()">
                    <span>💪 Trening</span>
                </button>
                <button class="nav-btn" data-view="stats" onclick="navigateTo('stats')">
                    <span>📊 Statystyki</span>
                </button>
            </div>
        </nav>
    </div>

    <script type="module" src="./src/js/main.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch((err) => {
                    console.log("ServiceWorker registration failed: ", err);
                });
            });
        }
    </script>
</body>
</html>
