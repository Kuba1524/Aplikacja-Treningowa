<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Kuba Training</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <style>
        .profile-gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .profile-gate.hidden { display: none !important; }
        .profile-gate-inner {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .profile-gate h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 8px;
            color: #f0f6fc;
        }
        .profile-gate p {
            color: #8b949e;
            margin: 0 0 28px;
            font-size: 0.95rem;
        }
        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .profile-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #151a23;
            color: #f0f6fc;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .profile-btn:active { transform: scale(0.98); }
        .profile-btn .emoji { font-size: 1.7rem; }
        .profile-btn .name { flex: 1; text-align: left; }
    </style>
</head>
<body>
    <div id="profile-gate" class="profile-gate hidden">
        <div class="profile-gate-inner">
            <h1>Kto trenuje?</h1>
            <p>Wybierz raz — zapamiętamy na tym urządzeniu</p>
            <div id="profile-list" class="profile-list"></div>
        </div>
    </div>

    <div class="app-shell">
        <main class="app-main">
            <section id="screen-home" class="screen"></section>
            <section id="screen-plan" class="screen hidden"></section>
            <section id="screen-stats" class="screen hidden"></section>
            <section id="screen-workout" class="screen hidden"></section>
        </main>

        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-btn active" data-view="home" onclick="navigateTo('home')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/>
                    </svg>
                </span>
                <span class="nav-lab">Home</span>
            </button>
        
            <button class="nav-btn" data-view="plan" onclick="navigateTo('plan')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="5" width="16" height="15" rx="2"/>
                        <path d="M8 3v4M16 3v4M4 10h16"/>
                    </svg>
                </span>
                <span class="nav-lab">Plan</span>
            </button>
        
            <button class="nav-btn nav-btn-primary" data-view="workout" onclick="navigateToWorkoutFromNav()">
                <span class="nav-ico nav-ico-primary" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 8h2v8H7zM15 8h2v8h-2z"/>
                        <path d="M9 11h6M5 10v4M19 10v4"/>
                    </svg>
                </span>
                <span class="nav-lab">Start</span>
            </button>
        
            <button class="nav-btn" data-view="stats" onclick="navigateTo('stats')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 19V10M12 19V5M19 19v-7"/>
                    </svg>
                </span>
                <span class="nav-lab">Stats</span>
            </button>
        
            <button class="nav-btn" data-view="more" onclick="navigateTo('plan')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 7h14M5 12h14M5 17h10"/>
                    </svg>
                </span>
                <span class="nav-lab">More</span>
            </button>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>

            apiKey: "AIzaSyBwW5kAYrZTtbaBx60y_4qUXU6dVJ-tD-s",
            authDomain: "training-app-a5a2f.firebaseapp.com",
            projectId: "training-app-a5a2f",
            storageBucket: "training-app-a5a2f.firebasestorage.app",
            messagingSenderId: "418834782578",
            appId: "1:418834782578:web:9e1c16504afd7ebc29e5eb",
            measurementId: "G-V1HENNKF2X"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
