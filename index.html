<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="x-app-build" content="v54" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="apple-mobile-web-app-title" content="KubaGym" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>KubaGym – aplikacja treningowa</title>

    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <style>
        .profile-gate {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg, #0b0e14);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .profile-gate.hidden { display: none !important; }
        .profile-gate-inner {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .profile-gate h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 8px;
            color: var(--text-main, #f0f6fc);
        }
        .profile-gate p {
            color: var(--text-dim, #8b949e);
            margin: 0 0 28px;
            font-size: 0.95rem;
        }
        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .profile-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid var(--border, rgba(255,255,255,0.1));
            background: var(--card-bg, #151a23);
            color: var(--text-main, #f0f6fc);
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .profile-btn:active { transform: scale(0.98); }
        .profile-btn .emoji { font-size: 1.7rem; }
        .profile-btn .name { flex: 1; text-align: left; }

        #auth-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }
        .auth-input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid var(--border, rgba(255,255,255,0.12));
            background: var(--card-bg, #121722);
            color: var(--text-main, #f0f6fc);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .auth-input:focus { border-color: #58a6ff; }
        .auth-input::placeholder { color: var(--text-dim, #6e7681); }
        .auth-wrap { display: flex; }
        .auth-pass-wrap { position: relative; }
        .auth-pass-wrap .auth-input { padding-right: 52px; }
        .auth-pass-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-dim, #8b949e);
            cursor: pointer;
            border-radius: 10px;
        }
        .auth-pass-toggle svg { width: 20px; height: 20px; }
        .auth-pass-toggle:active { color: var(--text-main, #f0f6fc); }
        #auth-submit {
            justify-content: center;
            background: linear-gradient(135deg, #58a6ff, #3b82f6);
            border: none;
            margin-top: 2px;
        }
        #auth-submit:disabled { opacity: 0.6; cursor: default; }
        .auth-toggle {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-dim, #8b949e);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 10px;
        }
        .auth-toggle:active { color: var(--text-main, #f0f6fc); }
        .auth-error {
            background: rgba(248,81,73,0.12);
            border: 1px solid rgba(248,81,73,0.35);
            color: #ffa198;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .auth-error.hidden { display: none; }
    </style>
</head>
<body>
    <div id="profile-gate" class="profile-gate">
        <div class="profile-gate-inner">
            <h1>Kuba<span>Gym</span></h1>
            <p id="auth-subtitle">Zaloguj się na swoje konto</p>

            <form id="auth-form" autocomplete="on">
                <input
                    id="auth-username"
                    class="auth-input"
                    type="text"
                    placeholder="Nazwa użytkownika"
                    autocomplete="username"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    required
                />
                <div class="auth-pass-wrap">
                    <input
                        id="auth-password"
                        class="auth-input"
                        type="password"
                        placeholder="Hasło"
                        autocomplete="current-password"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        required
                    />
                    <button type="button" id="auth-pass-toggle" class="auth-pass-toggle" aria-label="Pokaż hasło" aria-pressed="false" onclick="togglePasswordVisibility()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div id="auth-register-name-wrap" class="auth-wrap hidden">
                    <input
                        id="auth-register-name"
                        class="auth-input"
                        type="text"
                        placeholder="Jak się do Ciebie zwracać? (np. Kuba)"
                        autocomplete="name"
                        autocapitalize="words"
                        required
                    />
                </div>
                <button id="auth-submit" class="profile-btn" type="submit">Zaloguj się</button>
            </form>

            <div id="auth-error" class="auth-error hidden"></div>

            <button id="auth-toggle" class="auth-toggle" type="button" onclick="toggleAuthMode()">Nie masz konta? Zarejestruj się</button>
        </div>
    </div>

    <div class="app-shell">
        <main class="app-main">
            <section id="screen-home" class="screen"></section>
            <section id="screen-plan" class="screen hidden"></section>
            <section id="screen-stats" class="screen hidden"></section>
            <section id="screen-library" class="screen hidden"></section>
            <section id="screen-manage" class="screen hidden"></section>
            <section id="screen-workout" class="screen hidden"></section>
        </main>

        <nav class="bottom-nav" id="bottom-nav">
            <button class="nav-btn active" data-view="home" onclick="navigateTo('home')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/>
                    </svg>
                </span>
                <span class="nav-lab">Home</span>
            </button>

            <button class="nav-btn" data-view="plan" onclick="navigateTo('plan')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="5" width="16" height="15" rx="2"/>
                        <path d="M8 3v4M16 3v4M4 10h16"/>
                    </svg>
                </span>
                <span class="nav-lab">Plan</span>
            </button>

            <button class="nav-btn nav-btn-primary" data-view="workout" onclick="navigateToWorkoutFromNav()">
                <span class="nav-ico nav-ico-primary" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 8h2v8H7zM15 8h2v8h-2z"/>
                        <path d="M9 11h6M5 10v4M19 10v4"/>
                    </svg>
                </span>
                <span class="nav-lab">Start</span>
            </button>

            <button class="nav-btn" data-view="stats" onclick="navigateTo('stats')">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 19V10M12 19V5M19 19v-7"/>
                    </svg>
                </span>
                <span class="nav-lab">Stats</span>
            </button>

            <button class="nav-btn" id="more-nav-btn" onclick="toggleMoreSheet()">
                <span class="nav-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"/>
                        <circle cx="12" cy="5" r="1"/>
                        <circle cx="12" cy="19" r="1"/>
                    </svg>
                </span>
                <span class="nav-lab">Więcej</span>
            </button>

        </nav>
    </div>

    <div class="sheet-backdrop hidden" id="more-backdrop" onclick="closeMoreSheet()"></div>
    <div class="sheet" id="more-sheet" role="dialog" aria-label="Więcej">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Więcej</div>
        <button type="button" class="sheet-item" onclick="openManage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>Zarządzaj ćwiczeniami</span>
        </button>
        <button type="button" class="sheet-item" id="more-theme-item" onclick="toggleThemeSection()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
            <span>Motywy (kolory)</span>
        </button>
        <div id="more-theme-section" class="more-theme-section hidden"></div>
        <button type="button" class="sheet-item" id="more-backup-item" onclick="toggleBackupSection()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.375-9.375z"/></svg>
            <span>Kopia zapasowa</span>
        </button>
        <div id="more-backup-section" class="more-theme-section hidden">
            <div class="sheet-note">Pobierz lub przywróć cały postęp (historia, plan, waga).</div>
            <div class="mg-actions backup-actions">
                <button type="button" class="mg-btn ghost" onclick="downloadBackup()">Eksportuj</button>
                <button type="button" class="mg-btn primary" onclick="document.getElementById('backup-file').click()">Importuj</button>
                <input type="file" id="backup-file" accept="application/json,.json" class="hidden" onchange="handleBackupImport()" />
            </div>
        </div>
        <button type="button" class="sheet-item" onclick="navigateTo('library')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Biblioteka ćwiczeń</span>
        </button>
        <button type="button" class="sheet-item sheet-danger" onclick="logoutUser()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>Wyloguj się</span>
        </button>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

        const db = firebase.firestore();

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/exercises-lib.js"></script>
    <script src="js/progression.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

<!-- Pasek odpoczynku (timer miedzy seriami) -->
<div id="rest-timer-bar" class="rest-timer-bar"><div class="rest-timer-inner"><span class="rest-timer-label">Odpoczynek</span><span id="rest-timer-time" class="rest-timer-time">00:00</span><div class="rest-timer-actions"><button class="rest-timer-btn" onclick="addRestTime(30)" title="Dodaj 30 s">+30 s</button><button class="rest-timer-btn" onclick="stopRestTimer(true)" title="Pomin">Pomin</button></div></div></div>
</body>
</html>
